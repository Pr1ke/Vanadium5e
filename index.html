<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 2 28 9v14l-12 7-12-7V9z%22 fill=%22%23cfd6de%22/%3E%3Cpath d=%22m16 12-5 9h10z%22 fill=%22%23D9622B%22/%3E%3C/svg%3E">
<title>Vanadium — 5e Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#121317; --bg2:#191b21; --panel:#1f222a; --panel2:#262a33; --line:#323743; --line2:#3e4452;
  --ink:#e8e6e1; --ink2:#b4b2ab; --ink3:#878580;
  --accent:#e0703a; --accent2:#f29a5b; --steel:#8fa3b8; --gold:#d4ae5f;
  --t1:#8b5a4a; --t2:#6d7b55; --t3:#4f7a8e;
  --inc:#2f6fb5; --exc:#b5402f;
  --card:#f3ede2; --cardink:#1d1b18; --cardline:#d3c6ae; --cardhead:#2b2925;
  --serif:'Source Serif 4',Georgia,serif; --cond:'Barlow Condensed','Arial Narrow',sans-serif; --ui:Inter,system-ui,sans-serif;
}
html[data-theme=light]{
  --bg:#ece8df; --bg2:#e4dfd4; --panel:#f6f3ec; --panel2:#ebe6db; --line:#d2cabb; --line2:#c2b9a7;
  --ink:#1f1d1a; --ink2:#4b4740; --ink3:#7a746a; --accent:#b8501f; --accent2:#c9642f; --steel:#4f6377;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
a{color:var(--accent2)}
button{font:inherit;color:inherit}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;background:linear-gradient(180deg,#1b1d23,#15161b);border-bottom:2px solid var(--accent);flex:none;position:relative;z-index:30}
html[data-theme=light] #top{background:linear-gradient(180deg,#2a2622,#211e1a)}
#brand{font-family:var(--cond);font-weight:800;font-size:24px;letter-spacing:.04em;color:#f1ece3;text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
#brand svg{flex:none}
#brand b{color:var(--accent)}
nav.menu{display:flex;gap:2px;height:100%}
.mi{position:relative;height:100%;display:flex;align-items:center}
.mi>button{background:none;border:0;color:#d8d4cc;font-family:var(--cond);font-size:16px;font-weight:600;letter-spacing:.03em;padding:0 10px;height:100%;cursor:pointer;text-transform:uppercase}
.mi>button:hover,.mi.open>button{color:#fff;background:rgba(255,255,255,.06)}
.dd{display:none;position:absolute;top:100%;left:0;min-width:200px;background:var(--panel);border:1px solid var(--line2);border-top:2px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.45);padding:6px 0}
.mi.open .dd{display:block}
.dd a{display:flex;justify-content:space-between;gap:16px;padding:6px 14px;color:var(--ink);text-decoration:none}
.dd a:hover{background:var(--panel2);color:var(--accent2)}
.dd a span{color:var(--ink3);font-size:12px}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 0}
#searchwrap{margin-left:auto;position:relative;width:min(380px,40vw)}
#q{width:100%;background:#0d0e11;border:1px solid #3a3f4b;color:#eee;padding:7px 10px 7px 32px;border-radius:4px;font-size:14px;outline:none}
#q:focus{border-color:var(--accent)}
#searchwrap svg{position:absolute;left:9px;top:9px;opacity:.6}
#sres{display:none;position:absolute;top:110%;left:0;right:0;background:var(--panel);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5);max-height:70vh;overflow:auto;border-radius:4px}
#sres.on{display:block}
.sr{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.sr.sel,.sr:hover{background:var(--panel2)}
.sr .ty{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);border:1px solid var(--line2);padding:1px 5px;border-radius:3px;white-space:nowrap}
.sr .nm{flex:1}
.sr .ex{color:var(--ink3);font-size:12px}
.tbtn{background:none;border:1px solid #3a3f4b;color:#ddd;border-radius:4px;height:32px;min-width:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.tbtn:hover{border-color:var(--accent);color:#fff}
#burger{display:none}
/* ---------- layout ---------- */
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-height:0;display:flex}
.scroll{overflow:auto}
footer{flex:none;font-size:11px;color:var(--ink3);padding:6px 16px;border-top:1px solid var(--line);background:var(--bg2)}
/* list page */
.lp{display:grid;grid-template-columns:minmax(380px,44%) 1fr;flex:1;min-height:0}
.lp-left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.lp-head{padding:12px 14px 8px;border-bottom:1px solid var(--line);background:var(--bg2)}
.lp-head h1{margin:0 0 8px;font-family:var(--cond);font-size:26px;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px}
.lp-head h1 small{font-family:var(--ui);font-size:12px;color:var(--ink3);text-transform:none;letter-spacing:0;font-weight:400}
.frow{display:flex;gap:6px}
.frow input{flex:1;background:var(--panel);border:1px solid var(--line2);color:var(--ink);padding:6px 9px;border-radius:4px;outline:none}
.frow input:focus{border-color:var(--accent)}
.fbtn{background:var(--panel);border:1px solid var(--line2);color:var(--ink);padding:0 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.fbtn.on{border-color:var(--accent);color:var(--accent2)}
.filters{display:none;padding:8px 14px 4px;border-bottom:1px solid var(--line);max-height:46vh;overflow:auto;background:var(--bg2)}
.filters.on{display:block}
.fg{margin-bottom:8px}
.fg-h{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.05em;color:var(--ink2);margin-bottom:4px}
.fg-h button{background:none;border:0;color:var(--ink3);font-size:11px;cursor:pointer;padding:0;text-transform:none;font-family:var(--ui);font-weight:400}
.fg-h button:hover{color:var(--accent2)}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:12px;padding:2px 8px;border-radius:3px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;user-select:none;color:var(--ink2)}
.pill.inc{background:var(--inc);border-color:var(--inc);color:#fff}
.pill.exc{background:var(--exc);border-color:var(--exc);color:#fff;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);cursor:pointer}
.chip.exc{border-color:var(--exc);color:#f0a090}
.chip.inc{border-color:var(--inc);color:#9cc3f0}
.ltable{flex:1;overflow:auto}
table.list{width:100%;border-collapse:collapse}
table.list th{position:sticky;top:0;background:var(--panel2);text-align:left;font-family:var(--cond);text-transform:uppercase;font-size:13px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;color:var(--ink2);z-index:1}
table.list th.s-asc::after{content:' ▲';font-size:9px}
table.list th.s-desc::after{content:' ▼';font-size:9px}
table.list td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr.r{cursor:pointer}
table.list tr.r:hover td{background:var(--panel)}
table.list tr.r.sel td{background:var(--panel2);box-shadow:inset 0 0 0 0 transparent}
table.list tr.r.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td.nm{font-weight:600}
td.mu{color:var(--ink2);font-size:13px}
.lp-right{min-height:0;overflow:auto;padding:18px 22px 60px}
.empty{color:var(--ink3);padding:40px;text-align:center}
/* entity view */
.ent-h{display:flex;align-items:flex-start;gap:10px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:10px}
.ent-h h2{margin:0;font-family:var(--cond);font-size:32px;line-height:1;letter-spacing:.02em;flex:1}
.ent-h .meta{color:var(--ink3);font-size:12px;margin-top:4px;font-family:var(--ui)}
.ent-tools{display:flex;gap:6px}
.ibtn{background:var(--panel);border:1px solid var(--line2);border-radius:4px;height:30px;min-width:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);padding:0 8px;gap:5px;font-size:12px}
.ibtn:hover{color:var(--accent2);border-color:var(--accent)}
.ibtn.on{color:var(--gold);border-color:var(--gold)}
.src{font-size:12px;color:var(--ink3);margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.src a{cursor:pointer}
.rd{font-family:var(--serif);font-size:15.5px;line-height:1.55;max-width:820px}
.rd p{margin:0 0 .6em}
.rd p.small{font-size:13.5px}
.rd h3,.rd h4,.rd h5,.rd h6{font-family:var(--cond);letter-spacing:.02em;margin:1.1em 0 .35em;line-height:1.15}
.rd h3{font-size:24px;border-bottom:1px solid var(--line2);padding-bottom:2px}
.rd h4{font-size:20px;color:var(--accent2)}
.rd h5{font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel)}
.rd h6{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.rd ul{margin:0 0 .7em;padding-left:1.3em}
.rd li{margin:.15em 0}
.rd aside{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--steel);padding:10px 14px;margin:12px 0;font-size:14px;border-radius:3px}
.rd aside .ah{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);margin-bottom:4px;font-size:15px}
.rd blockquote{margin:14px 0;padding:8px 16px;border-left:3px solid var(--accent);font-style:italic;color:var(--ink2);font-size:17px}
.rd blockquote cite{display:block;font-style:normal;font-size:13px;margin-top:4px;color:var(--ink3);font-family:var(--ui)}
.tblw{overflow:auto;margin:10px 0 14px}
table.dt{border-collapse:collapse;font-family:var(--ui);font-size:13px;width:100%}
table.dt th{background:var(--panel2);text-align:left;padding:6px 8px;font-family:var(--cond);font-size:14px;letter-spacing:.03em;text-transform:uppercase;border-bottom:2px solid var(--accent)}
table.dt td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.dt tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.lnk{color:var(--accent2);cursor:pointer;border-bottom:1px dotted currentColor;text-decoration:none}
.pref{color:var(--steel);cursor:pointer;font-family:var(--ui);font-size:.85em;white-space:nowrap}
.pref:hover{text-decoration:underline}
/* ability card */
.ab{background:var(--card);color:var(--cardink);border-radius:4px;margin:12px 0 16px;font-family:var(--serif);font-size:14.5px;line-height:1.45;border:1px solid var(--cardline);box-shadow:0 2px 0 rgba(0,0,0,.25);max-width:620px;overflow:hidden}
.ab-h{display:flex;align-items:center;gap:8px;background:var(--cardhead);color:#f3ede2;padding:6px 10px}
.ab-n{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.02em;flex:1;line-height:1.1}
.ab-n a{color:inherit;text-decoration:none;cursor:pointer}
.ab-n a:hover{color:var(--accent2)}
.ab-c{font-family:var(--cond);font-weight:700;font-size:14px;background:var(--accent);color:#fff;padding:1px 8px;border-radius:3px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.ab-c.sig{background:#5b6c7d}
.ab-pin{background:none;border:0;color:#9a948a;cursor:pointer;padding:0 2px;font-size:16px;line-height:1}
.ab-pin.on{color:var(--gold)}
.ab-b{padding:6px 11px 9px}
.ab-fl{font-style:italic;color:#5a5348;margin-bottom:5px}
.ab-kw{display:flex;justify-content:space-between;gap:10px;font-family:var(--ui);font-weight:600;font-size:12.5px;border-top:1px solid var(--cardline);border-bottom:1px solid var(--cardline);padding:4px 0;margin-bottom:3px}
.ab-kw .act{color:#9b3d12;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.ab-dt{display:flex;justify-content:space-between;gap:10px;font-family:var(--ui);font-size:12.5px;padding:3px 0 6px;border-bottom:1px solid var(--cardline);margin-bottom:5px}
.ab-dt span{display:flex;gap:5px;align-items:flex-start}
.ab-dt svg{flex:none;margin-top:2px}
.ab-roll{font-family:var(--ui);font-weight:700;font-size:13px;margin:4px 0 2px;display:flex;align-items:center;gap:8px}
.rollbtn{border:1px solid #b8a98c;background:#e8dcc5;color:#3a2f22;border-radius:3px;cursor:pointer;font-size:11px;font-weight:700;padding:1px 7px;display:inline-flex;align-items:center;gap:4px;font-family:var(--ui)}
.rollbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.tier{display:flex;gap:8px;align-items:baseline;padding:2px 0;border-radius:3px;transition:background .3s}
.tb{flex:none;width:46px;text-align:center;font-family:var(--cond);font-weight:700;font-size:13px;color:#fff;border-radius:3px;padding:0 2px;letter-spacing:.02em}
.tier.n1 .tb{background:var(--t1)}.tier.n2 .tb{background:var(--t2)}.tier.n3 .tb{background:var(--t3)}
.tier.hit{background:rgba(224,112,58,.25);box-shadow:0 0 0 2px var(--accent)}
.ab-f{margin:5px 0 0}
.pot{font-family:var(--ui);font-weight:700;font-size:.82em;background:#2b2925;color:#f3ede2;border-radius:3px;padding:0 4px;white-space:nowrap}
.chr{font-family:var(--ui);font-weight:800;font-size:.85em;border:1px solid currentColor;border-radius:3px;padding:0 3px}
.ab-src{font-family:var(--ui);font-size:11px;color:#7a7164;border-top:1px dashed var(--cardline);padding:4px 11px;display:flex;justify-content:space-between;background:#ece4d4}
.ab-src a{color:#8c3f17;cursor:pointer}
.ab .lnk{color:#9b3d12}
.ab .pref{color:#3f5b74}
/* home */
.home{flex:1;overflow:auto}
.hero{padding:44px 24px 30px;text-align:center;background:radial-gradient(ellipse at 50% 0%,rgba(224,112,58,.22),transparent 60%),var(--bg2);border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--cond);font-size:58px;margin:0;letter-spacing:.04em;line-height:1}
.hero h1 b{color:var(--accent)}
.hero p{color:var(--ink2);max-width:640px;margin:10px auto 18px;font-size:15px}
.hero input{width:min(560px,90%);font-size:17px;padding:12px 16px;border-radius:5px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);outline:none}
.hero input:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:22px;max-width:1240px;margin:0 auto}
.gsec{grid-column:1/-1;font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700;margin:6px 0 -4px;font-size:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile b{font-family:var(--cond);font-size:21px;letter-spacing:.03em}
.tile span{color:var(--ink3);font-size:12.5px}
.tile em{font-style:normal;color:var(--accent2);font-family:var(--cond);font-weight:700;font-size:13px}
/* book */
.bk{display:grid;grid-template-columns:250px 1fr;flex:1;min-height:0}
.bk-nav{border-right:1px solid var(--line);overflow:auto;background:var(--bg2);padding:10px 0 40px}
.bk-nav a{display:block;padding:4px 14px;text-decoration:none;color:var(--ink2);font-size:13px;cursor:pointer}
.bk-nav a.ch{font-family:var(--cond);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);margin-top:4px}
.bk-nav a.ch.cur{color:var(--accent2)}
.bk-nav a.l1{padding-left:24px;font-weight:600}
.bk-nav a.l2{padding-left:34px}
.bk-nav a.l3{padding-left:46px;font-size:12px;color:var(--ink3)}
.bk-nav a:hover{color:var(--accent2)}
.bk-main{overflow:auto;padding:24px 34px 80px}
.bk-main .rd{margin:0 auto}
.chap-title{font-family:var(--cond);font-size:52px;letter-spacing:.04em;margin:0 0 8px;text-transform:uppercase;border-bottom:3px solid var(--accent);max-width:820px;margin:0 auto 16px}
.rd h2.big{font-family:var(--cond);font-size:38px;letter-spacing:.04em;text-transform:uppercase;margin:1.4em 0 .4em;color:var(--accent2);border-bottom:2px solid var(--line2)}
.bk-pager{display:flex;justify-content:space-between;max-width:820px;margin:40px auto 0;gap:10px}
.pgmark{float:right;font-family:var(--ui);font-size:10px;color:var(--ink3);border:1px solid var(--line);padding:0 4px;border-radius:3px;margin-left:8px}
/* class page */
.cls{flex:1;display:grid;grid-template-columns:230px 1fr;min-height:0}
.cls-nav{border-right:1px solid var(--line);overflow:auto;background:var(--bg2);padding:12px 0 40px}
.cls-nav .cn{display:block;padding:5px 14px;font-family:var(--cond);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);cursor:pointer;text-decoration:none}
.cls-nav .cn.cur{color:var(--accent2);background:var(--panel)}
.cls-nav .sub a{display:block;padding:3px 14px 3px 28px;font-size:12.5px;color:var(--ink3);cursor:pointer;text-decoration:none}
.cls-nav .sub a:hover{color:var(--accent2)}
.cls-main{overflow:auto;padding:22px 30px 80px}
.cls-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;border-bottom:3px solid var(--accent);padding-bottom:8px;margin-bottom:14px;max-width:1100px}
.cls-head h1{font-family:var(--cond);font-size:50px;margin:0;line-height:1;letter-spacing:.04em;text-transform:uppercase;flex:1}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line2);border-radius:4px;padding:4px 10px;font-size:12px;color:var(--ink3)}
.stat b{display:block;font-family:var(--cond);font-size:18px;color:var(--ink)}
.tabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;font-family:var(--cond);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);cursor:pointer;margin-bottom:-1px}
.tab.on{color:var(--accent2);border-color:var(--accent)}
.abgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:0 18px;max-width:1300px}
.abgrid .ab{margin:8px 0}
.abgh{grid-column:1/-1;font-family:var(--cond);font-size:22px;text-transform:uppercase;letter-spacing:.04em;margin:16px 0 0;border-bottom:1px solid var(--line2);color:var(--steel)}
.subsel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
/* roller */
#roller{position:fixed;right:18px;bottom:46px;width:300px;background:var(--panel);border:1px solid var(--line2);border-top:3px solid var(--accent);border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:40;display:none;font-size:13px}
#roller.on{display:block}
#roller .rh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-family:var(--cond);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
#roller .rh button{background:none;border:0;color:var(--ink3);cursor:pointer;font-size:18px}
#roller .rb{padding:0 12px 12px}
.chars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.chars label{display:flex;flex-direction:column;align-items:center;font-size:10px;text-transform:uppercase;color:var(--ink3);gap:2px;letter-spacing:.04em}
.chars input{width:100%;text-align:center;background:var(--bg);border:1px solid var(--line2);color:var(--ink);border-radius:3px;padding:4px 0;font-size:15px;font-weight:600}
.rrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.rrow select,.rrow input{background:var(--bg);border:1px solid var(--line2);color:var(--ink);border-radius:3px;padding:4px}
.bigroll{width:100%;background:var(--accent);border:0;color:#fff;font-family:var(--cond);font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:8px;border-radius:4px;cursor:pointer;margin-top:4px}
.bigroll:hover{background:var(--accent2)}
#rlog{max-height:220px;overflow:auto;margin-top:8px}
.rl{border-top:1px solid var(--line);padding:6px 0;display:flex;gap:10px;align-items:center}
.rl .tot{font-family:var(--cond);font-size:28px;font-weight:800;width:44px;text-align:center}
.rl .tt{font-size:11px;color:var(--ink3)}
.rl .tl{font-family:var(--cond);font-weight:700;font-size:14px;color:#fff;padding:0 6px;border-radius:3px;display:inline-block}
.rl .lab{font-weight:600}
#fab{position:fixed;right:18px;bottom:46px;z-index:39;background:var(--accent);border:0;color:#fff;width:50px;height:50px;border-radius:50%;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer;display:flex;align-items:center;justify-content:center}
#fab:hover{background:var(--accent2)}
/* hover preview */
#hov{position:fixed;z-index:60;max-width:480px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-top:2px solid var(--accent);box-shadow:0 14px 40px rgba(0,0,0,.55);padding:10px 14px;border-radius:4px;display:none;pointer-events:none}
#hov .rd{font-size:14px}
#hov h2{font-family:var(--cond);margin:0 0 6px;font-size:22px}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:8px 16px;border-radius:5px;z-index:70;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
/* pinned */
.pinpage{flex:1;overflow:auto;padding:22px 28px 80px}
.pinpage h1{font-family:var(--cond);font-size:34px;text-transform:uppercase;margin:0 0 4px;letter-spacing:.04em}
.pinpage .note{color:var(--ink3);margin-bottom:12px}
.pincard{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 14px;margin-bottom:12px;break-inside:avoid}
.pincols{columns:2 520px;column-gap:20px}
.pincols .ab{break-inside:avoid;margin-top:0}
@media (max-width:900px){
  nav.menu{display:none;position:absolute;top:52px;left:0;right:0;flex-direction:column;background:var(--panel);height:auto;border-bottom:1px solid var(--line2)}
  nav.menu.on{display:flex}
  .mi{height:auto;flex-direction:column;align-items:stretch}
  .mi>button{padding:10px 16px;text-align:left}
  .dd{position:static;box-shadow:none;border:0}
  #burger{display:flex}
  #brand span.long{display:none}
  .lp{grid-template-columns:1fr;grid-template-rows:minmax(240px,45%) 1fr}
  .lp-left{border-right:0;border-bottom:2px solid var(--accent)}
  .bk,.cls{grid-template-columns:1fr}
  .bk-nav,.cls-nav{display:none}
  .bk-main,.cls-main{padding:16px}
  .abgrid{grid-template-columns:1fr}
  .hero h1{font-size:40px}
  footer{font-size:9.5px;padding:4px 10px;line-height:1.3}
}
@media (max-width:560px){ #brand span{display:none} #searchwrap{flex:1;width:auto} #fab{bottom:70px} }
@media print{#top,footer,#fab,#roller,.ent-tools,.ab-pin{display:none!important}body{background:#fff;color:#000}}

/* ---------- monsters ---------- */
.mon{background:var(--card);color:var(--cardink);border:1px solid var(--cardline);border-radius:5px;max-width:640px;margin:10px 0 16px;font-family:var(--serif);font-size:14px;line-height:1.42;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.mon-h{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;background:var(--cardhead);color:#f3ede2;padding:8px 12px}
.mon-n{font-family:var(--cond);font-weight:800;font-size:24px;line-height:1.05;letter-spacing:.02em}
.mon-n a{color:inherit;text-decoration:none;cursor:pointer}
.mon-k{font-family:var(--ui);font-size:12px;color:#c9c1b3;margin-top:2px}
.mon-r{text-align:right;font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.03em;white-space:nowrap}
.mon-r .ev{display:inline-block;background:var(--accent);color:#fff;border-radius:3px;padding:0 7px;margin-top:3px;font-size:14px}
.mon-stats{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--cardline);background:#ebe2d0}
.mon-stats div{text-align:center;padding:5px 2px;border-right:1px solid var(--cardline)}
.mon-stats div:last-child{border-right:0}
.mon-stats b{display:block;font-family:var(--cond);font-size:21px;line-height:1.1}
.mon-stats span{font-family:var(--ui);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#6f665a}
.mon-def{font-family:var(--ui);font-size:12.5px;padding:6px 12px 2px;display:flex;flex-wrap:wrap;gap:4px 16px}
.mon-def b{color:#5a3b22}
.mon-chars{display:grid;grid-template-columns:repeat(5,1fr);margin:6px 12px 4px;border:1px solid var(--cardline);border-radius:4px;overflow:hidden}
.mon-chars div{text-align:center;padding:3px 0;font-family:var(--ui);font-size:11px;color:#6f665a;border-right:1px solid var(--cardline)}
.mon-chars div:last-child{border-right:0}
.mon-chars b{display:block;font-family:var(--cond);font-size:18px;color:var(--cardink)}
.mon-desc{padding:4px 12px;font-style:italic;color:#5a5348}
.mon-items{padding:2px 12px 8px}
.ma{border-top:1px solid var(--cardline);padding:7px 0 5px}
.ma-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ma-i{flex:none;width:22px;height:22px;border-radius:4px;background:#2b2925;color:#f3ede2;display:flex;align-items:center;justify-content:center}
.ma-i.trait{background:#6b5a3e}.ma-i.trig{background:#7a3b1d}.ma-i.vil{background:#8c1f1f}.ma-i.area{background:#3f5b74}.ma-i.ranged{background:#4b5e3b}
.ma-n{font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.02em}
.ma-roll{font-family:var(--ui);font-size:12px;font-weight:700;color:#5a3b22}
.ma-c{margin-left:auto;font-family:var(--cond);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;background:#5b6c7d;color:#fff;border-radius:3px;padding:0 6px}
.ma-c.mal{background:var(--accent)}.ma-c.vil{background:#8c1f1f}
.ma-kw{display:flex;justify-content:space-between;gap:8px;font-family:var(--ui);font-size:12px;font-weight:600;margin:3px 0 1px 29px;color:#3b352d}
.ma-kw .act{color:#9b3d12;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.ma-dt{display:flex;justify-content:space-between;gap:8px;font-family:var(--ui);font-size:12px;margin:0 0 3px 29px;color:#3b352d}
.ma-dt span{display:flex;gap:4px}
.ma-b{margin-left:29px}
.ma-b .tier{padding:1px 0}
.ma-b .ab-f{margin:3px 0 0}
.mon-src{font-family:var(--ui);font-size:11px;color:#7a7164;border-top:1px dashed var(--cardline);padding:4px 12px;display:flex;justify-content:space-between;gap:8px;background:#ece4d4}
.mon-src a{color:#8c3f17;cursor:pointer}
.mon .lnk{color:#9b3d12}.mon .pref{color:#3f5b74}
.mon .rollbtn{margin-left:4px}
.rd .tierp{display:flex;gap:8px;align-items:baseline;margin:2px 0 4px;font-family:var(--serif)}
.rd .tierp .tb{flex:none}
.tierp.n1 .tb{background:var(--t1)}.tierp.n2 .tb{background:var(--t2)}.tierp.n3 .tb{background:var(--t3)}
/* library & import */
.lib{flex:1;overflow:auto;padding:24px 28px 90px}
.lib h1,.imp h1{font-family:var(--cond);font-size:36px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.lib .note,.imp .note{color:var(--ink2);max-width:760px;margin:0 0 16px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;max-width:1240px}
.bookc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--steel)}
.bookc.k-core{border-top-color:var(--accent)}.bookc.k-bestiary{border-top-color:#8c1f1f}.bookc.k-adventure{border-top-color:var(--gold)}
.bookc .kind{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.bookc b{font-family:var(--cond);font-size:23px;line-height:1.1;letter-spacing:.02em}
.bookc .cnt{color:var(--ink3);font-size:12.5px}
.bookc .acts{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:7px 14px;font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent2)}
.btn.danger{background:transparent;color:#e08b7a;border:1px solid #6b3a31}
.btn:disabled{opacity:.5;cursor:default}
.imp{flex:1;overflow:auto;padding:24px 28px 90px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line2);border-radius:8px;padding:34px 20px;text-align:center;cursor:pointer;max-width:760px;background:var(--panel);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--panel2)}
.drop b{font-family:var(--cond);font-size:22px;letter-spacing:.03em}
.drop span{color:var(--ink3);font-size:13px}
.drop input{display:none}
.stage{max-width:760px;margin-top:16px}
.prog{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line2)}
.prog div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .2s}
.progt{font-size:13px;color:var(--ink2);margin:6px 0}
.pv{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:16px}
.pv .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pv label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;flex:1;min-width:200px}
.pv input,.pv select{background:var(--bg);border:1px solid var(--line2);color:var(--ink);border-radius:4px;padding:8px;font-size:15px;text-transform:none;letter-spacing:0}
.pvstats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.pvstats .stat{min-width:90px}
.pvlist{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:4px;font-size:13px;margin-bottom:12px}
.pvlist div{padding:5px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.pvlist div span{color:var(--ink3)}
.warn{background:rgba(181,64,47,.15);border:1px solid #6b3a31;color:#f0b4a6;border-radius:5px;padding:10px 14px;margin:10px 0;font-size:13.5px}
.okb{background:rgba(79,122,142,.18);border:1px solid #3f5b74;border-radius:5px;padding:10px 14px;margin:10px 0;font-size:13.5px}
.mine{max-width:760px;margin-top:26px}
.mine h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.05em;font-size:22px;margin:0 0 8px}
.mine .it{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:5px;margin-bottom:8px}
.mine .it .t{flex:1}
.mine .it .t b{display:block;font-family:var(--cond);font-size:18px}
.mine .it .t span{font-size:12px;color:var(--ink3)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--bg);z-index:100;font-family:var(--cond);font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
#loading .bar{width:220px;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
#loading .bar div{width:40%;height:100%;background:var(--accent);animation:ld 1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.backbar{display:none}
.mchips{display:none}
#tabbar,#msearch,#sheet,#peek,#scrim,.mtoc-btn{display:none}
.lp-right .mon{max-width:680px}
.bk-books{padding:0 14px 8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.bk-books select{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:4px;padding:6px;font-family:var(--cond);font-size:16px;font-weight:700}

/* ================= MOBILE MODE ================= */
body.mob{font-size:15px}
body.mob #top{height:50px;padding:0 10px;gap:8px}
body.mob nav.menu,body.mob #burger,body.mob #searchwrap,body.mob #pinsbtn,body.mob footer,body.mob #fab{display:none!important}
body.mob #brand{font-size:21px;flex:1;min-width:0}
body.mob #brand span{display:inline}
body.mob #mtitle{display:block}
body.mob .mbtn{display:flex}
.mbtn{display:none;background:none;border:0;color:#ddd;width:40px;height:40px;align-items:center;justify-content:center;border-radius:6px;cursor:pointer}
.mbtn:active{background:rgba(255,255,255,.08)}
body.mob #main{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
body.mob #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#15161b;border-top:1px solid #2c303a;z-index:45}
html[data-theme=light] body.mob #tabbar{background:#211e1a}
#tabbar button{flex:1;background:none;border:0;color:#9c988f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-family:var(--ui);font-weight:600;letter-spacing:.02em;cursor:pointer;-webkit-tap-highlight-color:transparent}
#tabbar button.on{color:var(--accent2)}
#tabbar button svg{width:22px;height:22px}
/* list pages become two screens */
body.mob .lp{display:flex;flex-direction:column;grid-template-columns:none}
body.mob .lp-left{flex:1;border:0;min-height:0}
body.mob .lp-right{display:none;padding:12px 14px 30px}
body.mob .lp.detail .lp-left{display:none}
body.mob .lp.detail .lp-right{display:block;flex:1}
body.mob .backbar{display:flex;align-items:center;gap:6px;position:sticky;top:-12px;margin:-12px -14px 10px;padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--line);z-index:3}
body.mob .backbar button{background:none;border:0;color:var(--accent2);font-family:var(--cond);font-size:17px;font-weight:700;letter-spacing:.03em;display:flex;align-items:center;gap:2px;cursor:pointer;padding:4px 6px}
body.mob .backbar .sp{flex:1}
body.mob .lp-head{padding:10px 12px 8px}
body.mob .lp-head h1{font-size:24px;margin-bottom:6px}
body.mob .frow input{font-size:16px;padding:9px 10px}
body.mob .fbtn{padding:0 12px;font-size:14px}
body.mob table.list thead{display:none}
body.mob table.list tr.r{display:grid;grid-template-columns:1fr auto;padding:9px 12px;border-bottom:1px solid var(--line);gap:1px 10px}
body.mob table.list td{border:0;padding:0;font-size:12.5px}
body.mob table.list td.nm{font-size:16px;grid-column:1}
body.mob table.list td:nth-child(2){grid-column:2;grid-row:1;text-align:right;color:var(--ink2);align-self:center}
body.mob table.list td:nth-child(n+3){grid-column:1/-1;color:var(--ink3)}
body.mob table.list td:nth-child(n+4){display:none}
body.mob table.list tr.r.sel td:first-child{box-shadow:none}
body.mob .filters{position:fixed;left:0;right:0;bottom:0;max-height:72vh;z-index:61;border-radius:14px 14px 0 0;border:1px solid var(--line2);padding:6px 14px calc(76px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .22s ease;display:block}
body.mob .filters.on{transform:none}
body.mob .filters .shead{display:flex;position:sticky;top:-6px;background:var(--bg2);padding:10px 0 8px;margin-bottom:6px;align-items:center;justify-content:space-between;z-index:2;border-bottom:1px solid var(--line)}
.filters .shead{display:none}
body.mob .filters .shead b{font-family:var(--cond);font-size:20px;text-transform:uppercase;letter-spacing:.04em}
body.mob .pill{font-size:14px;padding:6px 11px}
body.mob .chips .chip{font-size:12.5px;padding:3px 9px}
body.mob .ent-h h2{font-size:28px}
body.mob .rd{font-size:16px}
body.mob .ab,body.mob .mon{max-width:none;margin-left:-4px;margin-right:-4px}
body.mob .ab-dt,body.mob .ma-dt{flex-direction:column;gap:2px}
body.mob .ma-kw,body.mob .ma-dt,body.mob .ma-b{margin-left:0}
body.mob .mon-stats b{font-size:19px}
body.mob .mon-stats span{font-size:9px}
body.mob .tblw{margin-left:-14px;margin-right:-14px;padding:0 14px}
/* home */
body.mob .hero{padding:26px 16px 20px}
body.mob .hero h1{font-size:40px}
body.mob .hero p{font-size:14px}
body.mob .hero input{font-size:16px}
body.mob .grid{grid-template-columns:1fr 1fr;gap:9px;padding:14px}
body.mob .tile{padding:12px}
body.mob .tile b{font-size:18px}
body.mob .tile span{font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.mob .homelic{display:block}
.homelic{font-size:11px;color:var(--ink3);padding:4px 22px 30px;max-width:1240px;margin:0 auto}
/* book */
body.mob .bk,body.mob .cls{display:flex;flex-direction:column}
body.mob .bk-nav{display:block;position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:62;transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(14px + env(safe-area-inset-top));box-shadow:10px 0 40px rgba(0,0,0,.5)}
body.mob .bk-nav.on{transform:none}
body.mob .bk-nav a{padding:7px 16px;font-size:14px}
body.mob .bk-main{padding:14px 16px 90px;flex:1}
body.mob .chap-title{font-size:34px}
body.mob .rd h2.big{font-size:28px}
body.mob .mtoc-btn{display:flex;position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:44;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:22px;padding:10px 16px;font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;gap:6px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer}
body.mob .cls-nav{display:none}
body.mob .cls-main{padding:12px 14px 90px;flex:1}
body.mob .cls-head h1{font-size:36px}
body.mob .mchips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
body.mob .mchips::-webkit-scrollbar{display:none}
body.mob .mchips a{flex:none;padding:6px 12px;border-radius:16px;border:1px solid var(--line2);color:var(--ink2);text-decoration:none;font-family:var(--cond);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
body.mob .mchips a.cur{background:var(--accent);border-color:var(--accent);color:#fff}
body.mob .abgrid{grid-template-columns:1fr}
body.mob .lib,body.mob .imp,body.mob .pinpage{padding:16px 14px 90px}
body.mob .lib h1,body.mob .imp h1{font-size:28px}
body.mob .pincols{columns:1}
/* roller as sheet */
body.mob #roller{z-index:64;max-height:52vh;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));width:auto;border-radius:14px 14px 0 0;border:1px solid var(--line2);border-bottom:0;max-height:70vh;overflow:auto}
body.mob .chars input{font-size:17px;padding:7px 0}
body.mob .bigroll{padding:12px;font-size:20px}
/* search overlay */
body.mob #msearch.on{display:flex;flex-direction:column;position:fixed;inset:0;z-index:80;background:var(--bg)}
#msearch .mh{display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line);background:var(--bg2)}
#msearch input{flex:1;font-size:17px;padding:10px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);outline:none}
#msearch .mh button{background:none;border:0;color:var(--accent2);font-family:var(--cond);font-weight:700;font-size:17px;cursor:pointer}
#mres{flex:1;overflow:auto}
#mres .sr{padding:12px 14px}
#mres .hint{padding:18px 16px;color:var(--ink3)}
/* sheets */
body.mob #scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60}
body.mob #sheet.on,body.mob #peek.on{display:block;position:fixed;left:0;right:0;bottom:0;z-index:63;background:var(--bg2);border-radius:14px 14px 0 0;border-top:1px solid var(--line2);max-height:80vh;overflow:auto;padding:8px 14px calc(76px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:2px auto 10px}
#sheet h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-size:13px;margin:12px 2px 6px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sgrid a{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;text-decoration:none;color:var(--ink)}
.sgrid a b{font-family:var(--cond);font-size:17px;letter-spacing:.02em}
.sgrid a span{font-size:11.5px;color:var(--ink3)}
#peek .pk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
#peek .pk-h b{font-family:var(--cond);font-size:24px}
#peek .rd{font-size:15.5px}
body.mob #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
body.mob #hov{display:none!important}
@media (hover:none){ .tile:hover{transform:none} }

.rd li.ra{list-style:none;margin-left:-1.3em;background:var(--panel);border-left:3px solid var(--gold);padding:8px 12px;font-style:italic;border-radius:0 4px 4px 0;margin-bottom:6px}

/* ---------- encounter builder ---------- */
.enc{flex:1;display:grid;grid-template-columns:1fr 400px;min-height:0}
.enc-l{overflow:auto;padding:18px 24px 80px}
.enc-r{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
.enc-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.encname{flex:1;min-width:220px;background:transparent;border:0;border-bottom:2px solid var(--line2);color:var(--ink);font-family:var(--cond);font-size:32px;font-weight:800;letter-spacing:.02em;padding:2px 0;outline:none}
.encname:focus{border-color:var(--accent)}
.enc-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.encsel{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:4px;padding:7px;font-size:13px;max-width:180px}
.btn.sm{padding:5px 10px;font-size:13px}
.party{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.party label{display:flex;flex-direction:column;gap:3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);width:110px}
.party input{background:var(--bg);border:1px solid var(--line2);color:var(--ink);border-radius:4px;padding:7px 8px;font-size:18px;font-weight:600;width:100%}
.party .es{margin-left:auto;text-align:right;display:flex;flex-direction:column;justify-content:center}
.party .es span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.party .es b{font-family:var(--cond);font-size:30px;line-height:1}
.party .es small{color:var(--ink3);font-size:11.5px}
.meter-wrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px 10px;margin-bottom:16px}
.meter-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dlabel{font-family:var(--cond);font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-right:12px}
.evt{font-family:var(--cond);font-size:22px;font-weight:700;color:var(--ink2)}
.worth{color:var(--ink2);font-size:13px}
.meter{position:relative;display:flex;height:26px;border-radius:5px;overflow:visible}
.mseg{height:100%;opacity:.35;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:2px}
.mseg:first-child{border-radius:5px 0 0 5px}.mseg:last-child{border-radius:0 5px 5px 0}
.mseg.on{opacity:1}
.mseg span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:#fff;white-space:nowrap}
.mark{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--bg);transition:left .25s}
.mticks{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-top:8px}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 8px;flex-wrap:wrap}
.grp-h h2{font-family:var(--cond);font-size:22px;text-transform:uppercase;letter-spacing:.05em;margin:0}
.grp-h div{display:flex;gap:6px}
.mobonly{display:none}
.grp{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:5px;margin-bottom:10px}
.grp-t{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)}
.gname{flex:1;background:transparent;border:0;color:var(--ink);font-family:var(--cond);font-size:19px;font-weight:700;letter-spacing:.03em;outline:none;min-width:0}
.gev{font-family:var(--cond);font-weight:700;font-size:15px;padding:1px 8px;border-radius:3px;background:var(--panel2)}
.gev.ok{background:rgba(95,143,85,.3)}.gev.low{background:rgba(125,138,150,.3)}.gev.high{background:rgba(212,104,47,.35)}
.ent{display:flex;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:0}
.ent-n{flex:1;min-width:0}
.ent-n a{font-weight:600;font-size:15px}
.ent-n span{display:block;font-size:11.5px;color:var(--ink3)}
.ent select{background:var(--bg);color:var(--ink2);border:1px solid var(--line2);border-radius:4px;padding:4px;font-size:12px;max-width:110px}
.step{display:flex;align-items:center;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.step button{background:var(--panel2);border:0;color:var(--ink);width:28px;height:28px;font-size:16px;cursor:pointer}
.step button:hover{background:var(--accent);color:#fff}
.step b{min-width:28px;text-align:center;font-family:var(--cond);font-size:17px}
.gempty{padding:12px;color:var(--ink3);font-size:13px}
.encw{background:rgba(212,104,47,.1);border:1px solid rgba(212,104,47,.4);border-radius:5px;padding:10px 14px;margin:12px 0;font-size:13.5px}
.encw ul{margin:6px 0 0;padding-left:18px}
.encw li{margin:3px 0}
.encnote{color:var(--ink3);font-size:12px;margin-top:14px}
.pick-h{padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.pick-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pick-top b{font-family:var(--cond);font-size:19px;text-transform:uppercase;letter-spacing:.05em}
#closepick{display:none}
.pick-h input[type=search]{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--ink);padding:8px 10px;border-radius:4px;font-size:15px;outline:none}
.pick-tabs{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.fit{margin-left:auto;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.pick-list{flex:1;overflow:auto}
.prow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line)}
.prow:hover{background:var(--panel)}
.pn{flex:1;min-width:0}
.pn a{font-weight:600}
.pn span{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pev{font-family:var(--cond);font-weight:700;color:var(--ink2);white-space:nowrap;font-size:14px}
.addm{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.addm:hover{background:var(--accent2)}
.dlg{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
.dlg-b{background:var(--panel);border:1px solid var(--line2);border-top:3px solid var(--accent);border-radius:8px;padding:20px;max-width:560px;width:100%}
.dlg-b h2{font-family:var(--cond);font-size:28px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.dlg-b p{color:var(--ink2);margin:0 0 12px}
.dlgp{background:transparent;border:0;padding:0}
.dlgp label{width:calc(50% - 5px)}
body.mob .enc{display:flex;flex-direction:column}
body.mob .enc-l{padding:12px 14px 90px;flex:1}
body.mob .encname{font-size:26px}
body.mob .party label{width:calc(50% - 5px)}
body.mob .party .es{margin:4px 0 0;text-align:left;width:100%}
body.mob .mobonly{display:inline-flex}
body.mob .enc-r{position:fixed;left:0;right:0;bottom:0;top:12vh;z-index:63;border:1px solid var(--line2);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .22s ease;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
body.mob .enc-r.on{transform:none}
body.mob #closepick{display:flex}
body.mob .ent{flex-wrap:wrap}
body.mob .ent-n{flex-basis:100%}
body.mob .mticks{font-size:10px}
body.mob .mseg:not(.on) span{display:none}

/* ---------- respite embed ---------- */
.resp{flex:1;display:flex;flex-direction:column;min-height:0}
.resp-bar{display:flex;align-items:center;gap:10px;padding:6px 16px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:12.5px;flex:none;flex-wrap:wrap}
.resp-bar b{font-family:var(--cond);font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.resp-bar .sp{flex:1}
.resp-bar .rlinks{color:var(--ink3)}
.resp iframe{flex:1;width:100%;border:0;min-height:0;background:#a90c20}
body.mob .resp-bar{padding:5px 12px}
body.mob .resp-bar .rlinks{display:none}

/* =================== VANADIUM — clean app theme (overrides) =================== */
:root, html[data-theme=light]{
  --bg:#F7F7F5; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#F1F0EC; --hover:#EBEAE5; --line:#E4E2DC; --line2:#D3D0C7;
  --ink:#1A1A1A; --ink2:#55534E; --ink3:#8A877F;
  --accent:#D9622B; --accent2:#C2531F; --accsoft:#FCEDE4; --acctext:#A8461A;
  --steel:#4A6378; --steelsoft:#E8EEF3; --gold:#B8862B; --goldsoft:#FBF1DC;
  --ok:#3F7D4E; --oksoft:#E6F2E8; --bad:#C0392B; --badsoft:#FBE7E4;
  --t1:#9A5A48; --t2:#6B7D4F; --t3:#3F7590; --inc:#2E6FA8; --exc:#B23A2E;
  --card:#FFFFFF; --cardink:#1A1A1A; --cardline:#E4E2DC; --cardhead:#F1F0EC; --cardsub:#F7F7F5; --cardmut:#6E6B64;
  --serif:'Source Serif 4',Georgia,serif; --cond:Inter,system-ui,sans-serif; --ui:Inter,system-ui,sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --sh1:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.04); --sh2:0 12px 32px rgba(0,0,0,.12);
  --topbg:#FFFFFF; --topink:#1A1A1A; --field:#FFFFFF;
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#111214; --bg2:#18191C; --panel:#18191C; --panel2:#1F2024; --hover:#26272C; --line:#2A2B30; --line2:#3A3B41;
  --ink:#ECEBE8; --ink2:#A9A7A1; --ink3:#77756F;
  --accent:#E07038; --accent2:#F08A55; --accsoft:#3A2318; --acctext:#F2A27A;
  --steel:#8FA8BD; --steelsoft:#1E2830; --gold:#D4A85A; --goldsoft:#33291A;
  --ok:#6DB07E; --oksoft:#1B2B20; --bad:#E06A5A; --badsoft:#36201D;
  --card:#18191C; --cardink:#ECEBE8; --cardline:#2A2B30; --cardhead:#1F2024; --cardsub:#151619; --cardmut:#9A978F;
  --topbg:#18191C; --topink:#ECEBE8; --field:#111214;
  --sh1:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25); --sh2:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
body{font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:var(--accent2)}
::selection{background:var(--accsoft)}
/* ---------- top bar ---------- */
#top,html[data-theme=light] #top{height:56px;background:var(--topbg);border-bottom:1px solid var(--line);gap:18px;padding:0 20px}
#brand{font-family:var(--ui);font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--topink);gap:9px}
#brand svg{width:28px;height:28px}
nav.menu{gap:2px;height:auto}
.mi{height:auto}
.mi>button{font-family:var(--ui);font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink2);height:34px;padding:0 10px;border-radius:var(--r-sm);display:flex;align-items:center;gap:5px}
.mi>button::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.55}
.mi>button:hover,.mi.open>button{color:var(--ink);background:var(--panel2)}
.dd{top:calc(100% + 6px);border:1px solid var(--line);border-top:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh2);padding:6px;min-width:230px}
.dd a{padding:7px 10px;border-radius:var(--r-sm);font-size:14px}
.dd a:hover{background:var(--panel2);color:var(--ink)}
.dd a span{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.dd hr{margin:6px 4px}
#searchwrap{width:min(320px,34vw)}
#q{height:34px;background:var(--panel2);border:1px solid transparent;color:var(--ink);border-radius:var(--r-sm);padding:0 52px 0 34px;font-size:14px}
#q::placeholder{color:var(--ink3)}
#q:focus{background:var(--field);border-color:var(--accent);box-shadow:0 0 0 3px var(--accsoft)}
#searchwrap svg{top:10px;left:11px;opacity:.55;color:var(--ink2)}
#searchwrap::after{content:"/";position:absolute;right:8px;top:7px;font-size:11px;font-weight:500;color:var(--ink3);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:18px;pointer-events:none}
#sres{border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh2);top:calc(100% + 6px);padding:4px}
.sr{border-bottom:0;border-radius:var(--r-sm);padding:7px 10px}
.sr .ty{border:0;background:var(--panel2);color:var(--ink2);font-size:10.5px;font-weight:600;border-radius:999px;padding:1px 8px;letter-spacing:.02em}
.tbtn{border:0;background:none;color:var(--ink2);height:34px;min-width:34px;border-radius:var(--r-sm)}
.tbtn:hover{background:var(--panel2);color:var(--ink);border:0}
footer{background:transparent;border-top:1px solid var(--line);color:var(--ink3);font-size:12px;padding:8px 20px;text-align:center}
#loading{background:var(--bg)!important;color:var(--ink)!important}
#loading>div:first-child{font-family:var(--ui)!important;letter-spacing:-.02em!important;text-transform:none!important}
/* ---------- buttons & fields ---------- */
.btn{font-family:var(--ui);text-transform:none;letter-spacing:0;font-weight:600;font-size:14px;border-radius:var(--r-sm);height:36px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border:1px solid var(--accent);box-shadow:none;transition:background .15s,border-color .15s}
.btn:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ghost,.btn.ghost.sm{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--line2);background:var(--panel2);color:var(--ink)}
.btn.sm{height:30px;font-size:13px;padding:0 10px}
.btn.danger,.btn.ghost.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.ibtn{border-radius:var(--r-sm)!important}
input,select,textarea{font-family:var(--ui)}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]),select,textarea{border-radius:var(--r-sm)!important;border-color:var(--line)!important;background-color:var(--field)!important;color:var(--ink)!important}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accsoft)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.note{color:var(--ink2)}
.warn{background:var(--goldsoft)!important;border:1px solid transparent!important;color:var(--ink)!important;border-radius:var(--r-sm)!important}
.empty{color:var(--ink3)}
#toast{background:#1A1A1A!important;color:#fff!important;border-radius:999px!important;border:0!important;box-shadow:var(--sh2)!important;font-size:13px}
.dlg-b{border-radius:var(--r-lg)!important;border:1px solid var(--line)!important;background:var(--panel)!important;box-shadow:var(--sh2)!important}
.dlg-b h2{font-family:var(--ui)!important;text-transform:none!important;letter-spacing:-.01em!important;font-size:18px!important;font-weight:600!important}
/* ---------- headings everywhere: sentence case, Inter ---------- */
h1,h2,h3,.lp-head h1,.ent-h h2,.chap-title,.negtop h1,.neghub h1,.cardsp h1,.lib h1,.imp h1,.cls-h h1,.encname{font-family:var(--ui)!important;text-transform:none!important;letter-spacing:-.02em!important}
.neghub h1,.cardsp h1,.lib h1,.imp h1{font-size:30px!important;font-weight:700}
.negh,h2.negh,.gsec,.fg-h,.kind,.sadd>b,.ah{text-transform:none!important;letter-spacing:.01em!important;font-family:var(--ui)!important}
/* ---------- home ---------- */
.home{background:var(--bg)}
.hero{background:none;border:0;padding:64px 24px 28px}
.hero h1{font-family:var(--ui);font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1.15;color:var(--ink)}
.hero p{color:var(--ink2);font-size:16px;margin:12px auto 28px}
.hsearch{position:relative;width:min(640px,100%);margin:0 auto}
.hsearch svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.hsearch input,.hero .hsearch input{width:100%;height:56px;border-radius:999px!important;border:1px solid var(--line)!important;background:var(--field)!important;padding:0 56px 0 50px;font-size:16px;box-shadow:var(--sh1);color:var(--ink)}
.hsearch kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:500 11px var(--ui);color:var(--ink3);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 7px}
.hchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hchips a{font-size:13px;font-weight:500;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 13px;text-decoration:none}
.hchips a:hover{border-color:var(--line2);color:var(--ink)}
.hwrap{max-width:1080px;margin:0 auto;padding:12px 24px 48px}
.home .gsec{font-size:12px;font-weight:600;text-transform:uppercase!important;letter-spacing:.06em!important;color:var(--ink3);margin:34px 0 12px}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.feat{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;text-decoration:none;color:var(--ink);transition:border-color .15s,box-shadow .15s,transform .15s}
.feat:hover{border-color:var(--line2);box-shadow:var(--sh1);transform:translateY(-1px)}
.feat .fi{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.fi-acc{background:var(--accsoft);color:var(--accent)}.fi-steel{background:var(--steelsoft);color:var(--steel)}.fi-gold{background:var(--goldsoft);color:var(--gold)}.fi-moss{background:var(--oksoft);color:var(--ok)}
.feat b{font-size:15px;font-weight:600}
.feat span:last-child{font-size:13px;color:var(--ink2)}
.home .grid{padding:0;max-width:none;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;gap:4px;transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover{border-color:var(--line2);box-shadow:var(--sh1);transform:translateY(-1px)}
.tile b{font-family:var(--ui);font-size:15px;font-weight:600;letter-spacing:-.005em}
.tile span{font-size:13px;color:var(--ink2);line-height:1.45}
.tile em{align-self:flex-start;margin-top:8px;font-family:var(--ui);font-size:12px;font-weight:500;color:var(--acctext);background:var(--accsoft);border-radius:999px;padding:1px 9px}
/* ---------- list pages ---------- */
.lp-left{border-right:1px solid var(--line);background:var(--panel)}
.lp-head{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 16px 12px}
.lp-head h1{font-size:22px!important;font-weight:700}
.lp-head h1 small{font-size:12px;font-weight:500;background:var(--panel2);color:var(--ink2);border-radius:999px;padding:1px 8px;margin-left:2px}
table.list th{background:var(--panel);font-family:var(--ui);text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;color:var(--ink3);border-bottom:1px solid var(--line);padding:8px 10px}
table.list td{border-bottom:1px solid var(--line);padding:9px 10px}
table.list tr:hover td{background:var(--panel2)}
table.list tr.sel td{background:var(--accsoft)!important}
table.list tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.lp-right,.ent{background:var(--bg)}
.ent-h h2{font-size:28px!important;font-weight:700}
.chip,.tag,.kwc{border-radius:999px!important}
/* ---------- ability cards & stat blocks ---------- */
.ab,.mon{background:var(--card);color:var(--cardink);border:1px solid var(--cardline);border-radius:var(--r-md);box-shadow:var(--sh1);font-family:var(--serif)}
.ab-h,.mon-h{background:var(--card);color:var(--cardink);border-bottom:1px solid var(--cardline);padding:12px 14px}
.ab-n,.mon-n{font-family:var(--ui);font-weight:700;font-size:17px;letter-spacing:-.01em}
.mon-n{font-size:19px}
.ab-n a:hover{color:var(--accent)}
.mon-k{font-family:var(--ui);color:var(--cardmut);font-size:12.5px}
.mon-r{font-family:var(--ui);font-weight:500;font-size:13px;color:var(--cardmut);letter-spacing:0}
.mon-r .ev,.ab-c{font-family:var(--ui);font-weight:600;font-size:12px;letter-spacing:0;text-transform:none;background:var(--accsoft);color:var(--acctext);border-radius:999px;padding:1px 9px}
.ab-c.sig,.ma-c{background:var(--steelsoft);color:var(--steel);font-family:var(--ui);font-weight:600;font-size:11.5px;letter-spacing:0;text-transform:none;border-radius:999px;padding:1px 8px}
.ma-c.mal{background:var(--accsoft);color:var(--acctext)}.ma-c.vil{background:var(--badsoft);color:var(--bad)}
.ab-pin{color:var(--ink3)}
.mon-stats{background:var(--cardsub);border-bottom:1px solid var(--cardline)}
.mon-stats div{border-right:1px solid var(--cardline);padding:9px 2px}
.mon-stats b{font-family:var(--ui);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.mon-stats span{font-family:var(--ui);font-size:10.5px;letter-spacing:.03em;color:var(--cardmut);font-weight:500}
.mon-def{padding:10px 14px 4px}.mon-def b{color:var(--cardink)}
.mon-chars{margin:8px 14px;border-radius:var(--r-sm);border-color:var(--cardline)}
.mon-chars div{color:var(--cardmut);padding:6px 0;border-color:var(--cardline)}
.mon-chars b{font-family:var(--ui);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.mon-desc,.ab-fl{color:var(--cardmut)}
.mon-items{padding:4px 14px 10px}
.ma{border-top:1px solid var(--cardline);padding:10px 0 8px}
.ma-i{border-radius:6px;background:var(--panel2);color:var(--ink2)}
.ma-i.trait{background:var(--goldsoft);color:var(--gold)}.ma-i.trig{background:var(--accsoft);color:var(--accent)}.ma-i.vil{background:var(--badsoft);color:var(--bad)}.ma-i.area{background:var(--steelsoft);color:var(--steel)}.ma-i.ranged{background:var(--oksoft);color:var(--ok)}
.ma-n{font-family:var(--ui);font-weight:600;font-size:15px;letter-spacing:-.005em}
.ma-roll{color:var(--cardmut)}
.ma-kw,.ma-dt,.ab-kw,.ab-dt{color:var(--cardmut)}
.ma-kw .act,.ab-kw .act{color:var(--acctext);letter-spacing:.02em;font-size:11.5px}
.ab-kw,.ab-dt{border-color:var(--cardline)}
.rollbtn{border:1px solid var(--cardline);background:var(--card);color:var(--cardink);border-radius:999px;padding:1px 9px;font-weight:600}
.rollbtn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.tier{border-radius:var(--r-sm);padding:3px 4px}
.tb{font-family:var(--ui);font-weight:600;font-size:11.5px;border-radius:5px;padding:1px 4px;letter-spacing:0}
.tier.hit{background:var(--accsoft);box-shadow:0 0 0 1.5px var(--accent)}
.pot{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.mon-src,.ab-src{background:var(--cardsub);color:var(--cardmut);border-top:1px solid var(--cardline);padding:7px 14px;font-size:11.5px}
.mon-src a,.ab-src a,.mon .lnk,.ab .lnk{color:var(--acctext)}
.mon .pref,.ab .pref{color:var(--steel)}
.mon-lore{border-left-color:#7B5BB5;background:rgba(123,91,181,.07);border-radius:0 var(--r-sm) var(--r-sm) 0}
.dastb{background:#7B5BB5;font-family:var(--ui);text-transform:none;letter-spacing:0;font-weight:600;border-radius:999px;padding:0 8px}
/* ---------- rules reader ---------- */
.bk-nav{background:var(--panel);border-right:1px solid var(--line)}
.bk-nav a{border-radius:var(--r-sm)}
.bk-nav a.ch{font-family:var(--ui);text-transform:none;letter-spacing:-.005em;font-size:14px;font-weight:600}
.bk-nav a.ch.cur,.bk-nav a.cur{color:var(--accent2)}
.bk-nav a.part{font-family:var(--ui);font-size:11.5px;letter-spacing:.06em;font-weight:600}
.chap-title{font-size:38px!important;font-weight:700;border-bottom:0!important;margin-bottom:20px!important;color:var(--ink)}
.chap-part{font-family:var(--ui);font-size:12.5px;letter-spacing:.02em;text-transform:none;color:var(--ink3)}
.rd{font-size:16px;line-height:1.62;color:var(--ink)}
.rd h2.big{font-family:var(--ui);text-transform:none;letter-spacing:-.02em;font-size:28px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:6px}
.rd h3,.rd h4,.rd h5,.rd h6{font-family:var(--ui);letter-spacing:-.01em;font-weight:650}
.rd h3{font-size:21px}.rd h4{font-size:18px}.rd h5{font-size:16px}.rd h6{font-size:15px;color:var(--ink2)}
.rd aside{background:var(--panel2)!important;border:0!important;border-radius:var(--r-md)!important;padding:14px 16px!important}
.rd aside .ah{font-family:var(--ui);text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600}
.rd blockquote,.ra{background:var(--panel)!important;border-left:3px solid var(--gold)!important;border-radius:0 var(--r-sm) var(--r-sm) 0!important}
table.dt{border:1px solid var(--line);border-radius:var(--r-md);border-collapse:separate;border-spacing:0;overflow:hidden;background:var(--panel)}
table.dt th{background:var(--panel2);font-family:var(--ui);text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);color:var(--ink2)}
table.dt td{border-bottom:1px solid var(--line)}
table.dt tr:last-child td{border-bottom:0}
.pgmark{border-radius:999px;background:var(--panel2);border:0;color:var(--ink3)}
.cls-nav .cn{font-family:var(--ui);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600}
/* ---------- encounter builder ---------- */
.encname{font-size:26px!important;font-weight:700!important;border:0!important;background:transparent!important}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.grp-t{background:var(--panel2)}
.gname{font-family:var(--ui)!important;text-transform:none!important;letter-spacing:0!important;font-weight:600}
.ent{border-color:var(--line)}
.step{border-radius:var(--r-sm)!important;border-color:var(--line)!important;overflow:hidden}
.dlabel{font-family:var(--ui)!important;text-transform:none!important;letter-spacing:-.01em!important;font-weight:700}
.encscale{background:var(--goldsoft)!important;border:1px solid var(--line)!important;border-left:1px solid var(--line)!important;border-radius:var(--r-md)!important}
.encscale>b{text-transform:none!important;letter-spacing:0!important;font-family:var(--ui)!important}
.sessbar{background:var(--accsoft)!important;border-color:transparent!important;border-radius:var(--r-md)!important}
/* ---------- runners (montage / negotiation) ---------- */
.negpanel,.nstat,.negside,.mtround,.mtch,.negc,.beitem,.qac,.cdeck,.neglog{border-color:var(--line)!important;border-radius:var(--r-md)!important}
.negpanel,.nstat,.mtround,.mtch,.negc,.cdeck{background:var(--panel)!important}
.negc{box-shadow:none;transition:border-color .15s,box-shadow .15s}
.negc:hover{border-color:var(--line2)!important;box-shadow:var(--sh1)}
.negc b{font-family:var(--ui)!important;letter-spacing:-.005em!important}
.mtc{border-top:1px solid var(--line)!important}
.mtp span{border-width:1.5px;width:20px;height:20px}
.mtp b,.mtround>b{font-family:var(--ui)!important;text-transform:none!important;letter-spacing:-.01em!important}
.hchip{border-radius:999px;background:var(--panel);border-color:var(--line);font-weight:500}
.hchip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
.seg4{border-color:var(--line)!important;background:var(--panel2);padding:3px;border-radius:var(--r-sm)!important;gap:2px}
.seg4 button{background:transparent!important;border:0!important;border-radius:5px;color:var(--ink2)!important;font-weight:500}
.seg4 button.on{background:var(--panel)!important;color:var(--ink)!important;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.argt{border-radius:var(--r-md)!important;border-color:var(--line)!important;background:var(--panel)!important}
.argt.sel{border-color:var(--accent)!important;background:var(--accsoft)!important;box-shadow:0 0 0 1px var(--accent)}
.tierb{border-radius:var(--r-md)!important}
.negend{border-radius:var(--r-md)!important}
.mtev{background:var(--goldsoft)!important;border-left:3px solid var(--gold);border-radius:0 var(--r-md) var(--r-md) 0}
.tagk,.tagu,.mtsug span{border-radius:999px!important}
/* ---------- sessions & cards ---------- */
.mdedit textarea{border-radius:var(--r-md)!important;font-size:13.5px!important}
.mdprev{border:1px solid var(--line)!important;border-radius:var(--r-md)!important;background:var(--panel)}
.sdoc.cur{background:var(--accsoft);border-radius:var(--r-sm)}
.icard{border-radius:12px;box-shadow:var(--sh1)}
.ic-h{font-family:var(--ui)}
.cdeck-r{border-color:var(--line)!important}
/* ---------- mobile ---------- */
body.mob #top{height:52px;padding:0 12px}
body.mob .hero{padding:36px 16px 16px}
body.mob .hero h1{font-size:28px}
body.mob .hero p{font-size:14px;margin-bottom:20px}
body.mob .hsearch input{height:50px;font-size:16px}
body.mob .hsearch kbd{display:none}
body.mob .hwrap{padding:4px 14px 40px}
body.mob .home .gsec{margin:26px 0 10px}
body.mob .feats{grid-template-columns:1fr 1fr;gap:10px}
body.mob .feat{padding:14px}
body.mob .home .grid{grid-template-columns:1fr 1fr;gap:10px}
body.mob .tile{padding:12px 14px}
body.mob .tile b{font-size:14px}
#tabbar{background:var(--topbg)!important;border-top:1px solid var(--line)!important;box-shadow:none!important}
#tabbar a,#tabbar button{color:var(--ink3)!important;font-family:var(--ui)!important;text-transform:none!important;letter-spacing:0!important}
#tabbar .on,#tabbar a.on,#tabbar button.on{color:var(--accent)!important}
#fab{background:var(--accent)!important;box-shadow:0 4px 14px rgba(217,98,43,.32)!important;border:0!important}
#sheet,#peek{border-radius:var(--r-lg) var(--r-lg) 0 0!important;background:var(--panel)!important}
/* ---------- fixes round 1 ---------- */
.dlabel{text-transform:capitalize!important;font-size:24px!important}
input.gname,.gname{background:transparent!important;border:0!important;box-shadow:none!important;font-size:15px!important;padding:2px 4px!important}
input.gname:focus{background:var(--field)!important;box-shadow:0 0 0 3px var(--accsoft)!important}
.pick-h h2,.pick-h h3,.pick-h b{text-transform:none!important;letter-spacing:-.01em!important;font-family:var(--ui)!important}
.enc-r,.pick{background:var(--panel);border-left:1px solid var(--line)}
.dmeter,.dbar{border-radius:999px;overflow:hidden}
/* respite embed */
.resp-bar{background:var(--panel);padding:8px 20px;font-size:12.5px}
.resp-bar b{font-family:var(--ui)!important;text-transform:none!important;letter-spacing:0!important;font-size:13px;font-weight:600;color:var(--ink2)}
.resp-bar .rlinks a{color:var(--ink2)}
.resp iframe{background:var(--bg)}
.resp-bar,.resp-bar *{font-style:normal!important;font-family:var(--ui)!important}
.grp-h>div{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.grp-h .btn{white-space:nowrap}
body.mob .grp-h{flex-wrap:wrap;gap:8px}
body.mob .grp-h>div{justify-content:flex-start}
.dseg,.dm span,.dmeter span{font-family:var(--ui)!important;letter-spacing:.02em!important}
/* =================== VANADIUM 5E — additions =================== */
:root, html[data-theme=light]{ --r1:#7d7a72; --r2:#3F7D4E; --r3:#2E6FA8; --r4:#7B5BB5; --r5:#C27A1A; --r6:#B23A2E; --rx:#8A877F; --nat20:#3F7D4E; --nat1:#B23A2E }
html[data-theme=dark]{ --r1:#A9A7A1; --r2:#6DB07E; --r3:#6EA6DA; --r4:#A88BDB; --r5:#E3A24F; --r6:#E06A5A; --rx:#A9A7A1; --nat20:#6DB07E; --nat1:#E06A5A }
#brand .ed5{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;letter-spacing:.02em;margin-left:-2px}
.edseg{display:flex;background:var(--panel2);border-radius:var(--r-sm);padding:3px;gap:2px;flex:none}
.edseg button{border:0;background:transparent;color:var(--ink2);font-size:12px;font-weight:600;padding:3px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
.edseg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
body.mob .edseg{display:none}
#sheet .edseg{display:flex;margin:4px 0 6px}
#sheet .edseg button{flex:1;font-size:14px;padding:8px}
/* source badges */
.edb{display:inline-block;font-size:10.5px;font-weight:600;border-radius:999px;padding:0 7px;line-height:17px;background:var(--panel2);color:var(--ink2);white-space:nowrap;font-family:var(--ui);font-style:normal;vertical-align:1px}
.edb.e2014{background:var(--steelsoft);color:var(--steel)}.edb.e2024{background:var(--accsoft);color:var(--acctext)}.edb.ehb{background:var(--goldsoft);color:var(--gold)}
td .edb{margin-left:6px}
/* rarity */
.rar{font-weight:600}.rar-common{color:var(--r1)}.rar-uncommon{color:var(--r2)}.rar-rare{color:var(--r3)}.rar-very-rare{color:var(--r4)}.rar-legendary{color:var(--r5)}.rar-artifact{color:var(--r6)}.rar-varies{color:var(--rx)}
/* 5e stat block */
.mon .mon-h .crb{display:inline-block;background:var(--accsoft);color:var(--acctext);border-radius:999px;padding:1px 9px;font-weight:600;font-size:12px;margin-top:3px}
.mon-stats.s5{grid-template-columns:repeat(5,1fr)}
.mon-stats .rollable{cursor:pointer}
.mon-stats .rollable:hover b{color:var(--accent)}
.abil{display:grid;grid-template-columns:repeat(6,1fr);margin:10px 14px 6px;border:1px solid var(--cardline);border-radius:var(--r-sm);overflow:hidden}
.abil div{text-align:center;padding:6px 0 5px;border-right:1px solid var(--cardline);font-family:var(--ui);cursor:pointer;user-select:none}
.abil div:last-child{border-right:0}
.abil div:hover{background:var(--cardsub)}
.abil i{display:block;font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--cardmut)}
.abil b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.abil small{display:block;font-size:11px;color:var(--cardmut);font-variant-numeric:tabular-nums}
.abil small.sv{color:var(--acctext);font-weight:600}
.mon-def5{font-family:var(--ui);font-size:12.5px;padding:4px 14px 6px;line-height:1.55}
.mon-def5 div{margin:1px 0}
.mon-def5 b{font-weight:600}
.msec{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acctext);margin:12px 0 0;padding-bottom:3px;border-bottom:1px solid var(--accent)}
.msec+.ma{border-top:0}
.msec small{font-weight:500;text-transform:none;letter-spacing:0;color:var(--cardmut);font-size:12px;display:block;margin:4px 0 2px;font-family:var(--serif);font-size:14px;border:0}
.ma5{padding:6px 0 4px;border-top:1px solid var(--cardline);font-size:14.5px;line-height:1.5}
.ma5 .mn{font-weight:700;font-style:italic}
.ma5 .mli{display:inline-block;margin:2px 0 0 10px}
.mon-r .ab-pin{margin-left:4px;vertical-align:1px}
.mon-lore5{padding:2px 14px 6px;font-size:14px;color:var(--cardmut)}
/* clickable dice */
.dice{color:var(--acctext);cursor:pointer;border-bottom:1px dashed currentColor;white-space:nowrap;font-family:inherit}
.dice:hover{background:var(--accsoft);border-radius:3px}
/* spell card */
.sp5{background:var(--card);color:var(--cardink);border:1px solid var(--cardline);border-radius:var(--r-md);box-shadow:var(--sh1);max-width:680px;overflow:hidden;margin:10px 0 16px}
.sp5-h{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--cardline)}
.sp5-h .t{flex:1}
.sp5-n{font-family:var(--ui);font-weight:700;font-size:19px;letter-spacing:-.01em}
.sp5-n a{color:inherit;text-decoration:none;cursor:pointer}
.sp5-k{font-family:var(--ui);font-size:12.5px;color:var(--cardmut);font-style:italic;margin-top:2px}
.sp5-g{display:grid;grid-template-columns:repeat(4,1fr);background:var(--cardsub);border-bottom:1px solid var(--cardline)}
.sp5-g div{padding:8px 10px;border-right:1px solid var(--cardline);font-family:var(--ui);font-size:13px;min-width:0}
.sp5-g div:last-child{border-right:0}
.sp5-g span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--cardmut);margin-bottom:1px}
.sp5-b{padding:10px 14px 4px;font-family:var(--serif);font-size:15px;line-height:1.55}
.sp5-b p{margin:0 0 .6em}
.sp5-b .tblw{margin:6px 0 12px}
.sp5-f{font-family:var(--ui);font-size:11.5px;color:var(--cardmut);background:var(--cardsub);border-top:1px solid var(--cardline);padding:7px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tagc{display:inline-block;font-family:var(--ui);font-style:normal;font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;line-height:18px;margin-left:4px;background:var(--steelsoft);color:var(--steel)}
.tagc.conc{background:var(--goldsoft);color:var(--gold)}
.lvlpill{flex:none;font-family:var(--ui);font-weight:600;font-size:12px;background:var(--accsoft);color:var(--acctext);border-radius:999px;padding:1px 10px;white-space:nowrap}
body.mob .sp5-g{grid-template-columns:1fr 1fr}
body.mob .sp5-g div:nth-child(2){border-right:0}
body.mob .sp5-g div:nth-child(-n+2){border-bottom:1px solid var(--cardline)}
body.mob .abil{margin:8px 10px}
body.mob .abil b{font-size:15px}
/* kv tables on entity pages */
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-family:var(--ui);font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin:0 0 14px;max-width:820px}
.kv b{color:var(--ink2);font-weight:600}
body.mob .kv{grid-template-columns:1fr;gap:0}
body.mob .kv b{margin-top:6px}
/* class page */
.ctbl{max-width:1100px}
.ctbl table.dt td:nth-child(3){min-width:200px}
.ctbl table.dt td,.ctbl table.dt th{white-space:nowrap}
.ctbl table.dt td:nth-child(3){white-space:normal}
.feat5{max-width:820px;margin:0 0 6px}
.feat5>h3 .lv{font-size:12px;font-weight:600;color:var(--acctext);background:var(--accsoft);border-radius:999px;padding:1px 9px;margin-left:8px;vertical-align:3px}
.splist{columns:3 220px;column-gap:24px;font-size:14px;max-width:1000px}
.splist h4{break-after:avoid;margin:10px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.splist a{display:block;padding:1px 0;cursor:pointer;color:var(--ink);text-decoration:none}
.splist a:hover{color:var(--accent2)}
/* roller (5e) */
.dq{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.dq button{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 0;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink)}
.dq button:hover{border-color:var(--accent);color:var(--accent2)}
#rexpr{flex:1;min-width:0;font-size:15px;padding:6px 8px}
.advseg{display:flex;background:var(--panel2);border-radius:var(--r-sm);padding:3px;gap:2px;width:100%}
.advseg button{flex:1;border:0;background:transparent;color:var(--ink2);font-size:12.5px;font-weight:600;padding:5px;border-radius:5px;cursor:pointer}
.advseg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.rl .tot.n20{color:var(--nat20)}.rl .tot.n1{color:var(--nat1)}
.rl .dropd{text-decoration:line-through;opacity:.55}
/* DM screen */
.scr{flex:1;overflow:auto;padding:22px 28px 90px}
.scr h1{font-size:30px;margin:0 0 4px}
.scr .note{margin:0 0 16px;max-width:760px}
.scrg{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;max-width:1400px}
.scrc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;break-inside:avoid}
.scrc h3{margin:0 0 8px;font-size:15px;font-weight:650}
.scrc table.dt{font-size:12.5px}
.scrc p,.scrc li{font-size:13px;margin:4px 0;line-height:1.5}
.scrc ul{padding-left:18px;margin:4px 0}
body.mob .scr{padding:14px 12px 90px}
body.mob .scrg{grid-template-columns:1fr}
/* encounter (5e) */
.diffbar{display:flex;height:26px;border-radius:999px;overflow:hidden;position:relative;background:var(--panel2)}
.diffbar .seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.04em;text-transform:uppercase;opacity:.35;white-space:nowrap;overflow:hidden}
.diffbar .seg.on{opacity:1}
.diffbar .mk{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--bg);transition:left .25s}
.pmembers{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
