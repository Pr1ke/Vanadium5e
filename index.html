.pm{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px}
.pm input{width:44px!important;padding:2px 4px!important;font-size:13px!important;text-align:center;height:24px}
.pm button{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:15px;padding:0 4px}
.method{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2)}
/* initiative tracker */
.it5{flex:1;display:grid;grid-template-columns:minmax(420px,1fr) minmax(360px,700px);min-height:0}
.it5-l{overflow:auto;padding:18px 22px 90px;border-right:1px solid var(--line)}
.it5-r{overflow:auto;padding:18px 22px 90px;background:var(--bg)}
.it5-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.it5-top h1{font-size:26px;margin:0;flex:1}
.rnd{font-size:13px;color:var(--ink2);background:var(--panel2);border-radius:999px;padding:3px 12px;font-weight:600}
.cbt{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;margin-bottom:8px;transition:border-color .15s,box-shadow .15s}
.cbt.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accsoft)}
.cbt.dead{opacity:.5}
.cbt.dead .cn b{text-decoration:line-through}
.cbt .ini input{width:52px!important;text-align:center;font-size:18px!important;font-weight:700;padding:4px 0!important}
.cbt .cn{min-width:0}
.cbt .cn b{font-size:15px;font-weight:600;cursor:pointer}
.cbt .cn b:hover{color:var(--accent2)}
.cbt .cn .sub{font-size:12px;color:var(--ink3)}
.cbt .cconds{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cbt .cconds span{font-size:11px;font-weight:600;background:var(--badsoft);color:var(--bad);border-radius:999px;padding:0 8px;cursor:pointer}
.cbt .hpw{display:flex;align-items:center;gap:6px}
.hpbar{width:90px;height:6px;border-radius:999px;background:var(--panel2);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--ok)}
.hpbar i.mid{background:var(--gold)}.hpbar i.low{background:var(--bad)}
.hpv{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;min-width:64px;text-align:right}
.hpin{width:58px!important;padding:4px 6px!important;font-size:13px!important}
.cbt .acts{display:flex;gap:4px}
.cbt .acts button{height:28px;min-width:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink2);font-size:12px;font-weight:600;padding:0 6px}
.cbt .acts button:hover{border-color:var(--accent);color:var(--accent2)}
.cbt .acts button.dmg{color:var(--bad)}.cbt .acts button.heal{color:var(--ok)}
.addrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r-md);padding:10px;margin:10px 0}
.addrow input{padding:6px 8px!important}
.condpick{display:flex;flex-wrap:wrap;gap:4px;padding:6px 0 0}
.condpick span{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;cursor:pointer;color:var(--ink2)}
.condpick span.on{background:var(--bad);border-color:var(--bad);color:#fff}
body.mob .it5{display:flex;flex-direction:column}
body.mob .it5-l{padding:12px 12px 90px;border:0}
body.mob .it5-r{display:none}
body.mob .cbt{grid-template-columns:48px 1fr}
body.mob .cbt .hpw{grid-column:1/-1;justify-content:space-between}
/* import (5etools) */
.imp code{font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:4px}
.attrib{font-size:11.5px;color:var(--ink3);max-width:900px;line-height:1.5;margin-top:22px}
/* book nav parts (from Vanadium) */
.bk-nav a.part{font-family:var(--cond);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin-top:14px;border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between}
.bk-nav a.part span{font-size:11px;background:var(--panel2);border-radius:8px;padding:0 6px;letter-spacing:0}
.bk-nav a.part.open{color:var(--accent2)}
.bk-nav a.ch.sub{padding-left:22px;font-size:14.5px}
.bk-nav a.sub.l1,.bk-nav a.sub.l2,.bk-nav a.sub.l3{padding-left:34px}
.chap-part{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--ink3);margin-bottom:-6px}

</style>
</head>
